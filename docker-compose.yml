services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 5

  app:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      target: test
    working_dir: /app
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
    environment:
      # Reached over the compose network, so the host/port are fixed here,
      # not the host-side DB_HOST/DB_PORT.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  gomodcache:
