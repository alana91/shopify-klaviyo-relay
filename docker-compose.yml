services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 5

  app:
    build: .
    ports:
      - "${PORT}:${PORT}"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      target: test
    working_dir: /app
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  gomodcache:
