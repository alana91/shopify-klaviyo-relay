<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopify → Klaviyo Relay</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
    h1 { font-size: 1.25rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e5e5e5; }
    th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #666; }
    td.error { color: #b00020; font-family: ui-monospace, monospace; font-size: 0.85rem; }
    .status { font-weight: 600; }
    .status-succeeded { color: #1a7f37; }
    .status-failed, .status-expired { color: #b00020; }
    .status-retrying { color: #9a6700; }
    .status-received { color: #0969da; }
    .empty { color: #666; font-style: italic; }
    nav#pages { margin-top: 1rem; display: flex; gap: 0.25rem; flex-wrap: wrap; }
    nav#pages button { padding: 0.25rem 0.6rem; border: 1px solid #d0d0d0; background: #fff; cursor: pointer; border-radius: 4px; }
    nav#pages button[disabled] { cursor: default; opacity: 0.5; }
    nav#pages button.current { background: #0969da; color: #fff; border-color: #0969da; }
  </style>
</head>
<body>
  <h1>Shopify → Klaviyo Relay</h1>
  <table>
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Status</th>
        <th>Retries</th>
        <th>Last Error</th>
        <th>Created At</th>
      </tr>
    </thead>
    <tbody id="events"></tbody>
  </table>
  <nav id="pages"></nav>

  <script>
    const PAGE_SIZE = 50;
    let currentPage = 1;

    function cell(text, className) {
      const td = document.createElement("td");
      td.textContent = text;
      if (className) td.className = className;
      return td;
    }

    function row(e) {
      const tr = document.createElement("tr");
      tr.appendChild(cell(e.order_id));
      tr.appendChild(cell(e.status, "status status-" + e.status));
      tr.appendChild(cell(e.retry_count));
      tr.appendChild(cell(e.last_error || "", "error"));
      tr.appendChild(cell(new Date(e.created_at).toLocaleString()));
      return tr;
    }

    function emptyRow() {
      const tr = document.createElement("tr");
      const td = cell("No events yet.", "empty");
      td.colSpan = 5;
      tr.appendChild(td);
      return tr;
    }

    function pageButton(label, page, opts) {
      opts = opts || {};
      const b = document.createElement("button");
      b.textContent = label;
      if (opts.disabled) b.disabled = true;
      if (opts.current) b.className = "current";
      if (!opts.disabled && !opts.current) {
        b.addEventListener("click", function () {
          currentPage = page;
          refresh();
        });
      }
      return b;
    }

    function renderPages(total, limit) {
      const nav = document.getElementById("pages");
      const totalPages = Math.max(1, Math.ceil(total / limit));
      if (currentPage > totalPages) currentPage = totalPages;

      const buttons = [pageButton("Prev", currentPage - 1, { disabled: currentPage <= 1 })];
      for (let p = 1; p <= totalPages; p++) {
        buttons.push(pageButton(String(p), p, { current: p === currentPage }));
      }
      buttons.push(pageButton("Next", currentPage + 1, { disabled: currentPage >= totalPages }));
      nav.replaceChildren(...buttons);
    }

    async function refresh() {
      const res = await fetch("/api/events?page=" + currentPage + "&limit=" + PAGE_SIZE);
      if (!res.ok) return;
      const data = await res.json();

      const tbody = document.getElementById("events");
      if (data.events.length === 0) {
        tbody.replaceChildren(emptyRow());
      } else {
        tbody.replaceChildren(...data.events.map(row));
      }

      renderPages(data.total, data.limit);
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
